<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tìm Kiếm & Đánh Giá Quán Ăn</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body>
  <div class="container">
    <h1>Tìm Kiếm & Đánh Giá Địa Điểm Ăn Uống</h1>

    <!-- Ô tìm kiếm -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Nhập tên quán hoặc địa chỉ (VD: Cơm tấm Ba Ghiền, Quận 3)..."
      />
      <button id="searchBtn">Tìm kiếm</button>
    </div>

    <!-- Thông báo lỗi / không tìm thấy -->
    <div id="messageBox" class="message hidden"></div>

    <!-- Khung hiển thị kết quả quán ăn (Modal/Prompt Card) -->
    <div id="resultCard" class="result-card hidden">
      <div class="place-header">
        <h2 id="placeName">Tên quán</h2>
        <span id="placeRating" class="badge">⭐ 4.5 (100)</span>
      </div>
      <p id="placeAddress" class="address">📍 Địa chỉ quán...</p>

      <div class="actions">
        <a id="directionsLink" href="#" target="_blank" class="btn-map">
          🗺️ Xem đường đi & Mở trên Google Maps
        </a>
      </div>

      <hr />

      <!-- Form viết đánh giá -->
      <div class="review-form">
        <h3>Viết đánh giá của bạn</h3>
        <input type="text" id="reviewerName" placeholder="Tên của bạn (không bắt buộc)" />
        <select id="ratingSelect">
          <option value="5">⭐⭐⭐⭐⭐ (5 sao - Tuyệt vời)</option>
          <option value="4">⭐⭐⭐⭐ (4 sao - Ngon)</option>
          <option value="3">⭐⭐⭐ (3 sao - Bình thường)</option>
          <option value="2">⭐⭐ (2 sao - Tệ)</option>
          <option value="1">⭐ (1 sao - Rất tệ)</option>
        </select>
        <textarea id="commentInput" rows="3" placeholder="Chia sẻ cảm nhận của bạn về món ăn, phục vụ..."></textarea>
        <button id="submitReviewBtn">Gửi đánh giá</button>
      </div>

      <!-- Danh sách bình luận -->
      <div class="reviews-section">
        <h3>Đánh giá từ cộng đồng & Google Maps</h3>
        <div id="reviewsList"></div>
      </div>
    </div>
  </div>
<script src="../Javascript/main.js"></script>

// Xử lý tìm kiếm
const handleSearch = async () => {
  const query = searchInput.value.trim();
  if (!query) {
    showMessage('Vui lòng nhập địa chỉ hoặc tên quán ăn!', 'error');
    return;
  }

  resultCard.classList.add('hidden');
  showMessage('Đang tìm kiếm địa điểm trên Google Maps...', 'loading');

  try {
    const res = await fetch(`http://localhost:5000/api/places/search?q=${encodeURIComponent(query)}`);
    const result = await res.json();

    if (!result.success) {
      showMessage(result.message, 'error');
      return;
    }

    hideMessage();
    currentPlace = result.data;

    // Đổ dữ liệu lên giao diện
    placeNameEl.textContent = currentPlace.name;
    placeRatingEl.textContent = `⭐ ${currentPlace.rating} (${currentPlace.userRatingCount})`;
    placeAddressEl.textContent = `📍 ${currentPlace.address}`;
    directionsLinkEl.href = currentPlace.googleMapsUri;

    renderReviews(currentPlace.localReviews || [], currentPlace.googleReviews || []);
    resultCard.classList.remove('hidden');
  } catch (error) {
    showMessage('Lỗi kết nối tới server backend!', 'error');
  }
};
